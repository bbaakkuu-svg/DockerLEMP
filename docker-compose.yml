services:
  # Servicio 1: Servidor Web Nginx (Reverse Proxy y Archivos Estáticos)
  nginx:
    image: nginx:alpine
    container_name: lemp_nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8085}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - lemp-network

  # Servicio 2: Procesador PHP-FPM (Lógica de Aplicación)
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    image: php:8.2-fpm-alpine
    container_name: lemp_php
    restart: unless-stopped
    volumes:
      - ./:/var/www/html
    environment:
      - MYSQL_HOST=mysql
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lemp_database}
      - MYSQL_USER=${MYSQL_USER:-lemp_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret_user_pass_2026}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-secret_root_pass_2026}
    networks:
      - lemp-network

  # Servicio 3: Motor de Base de Datos MySQL
  mysql:
    image: mysql:8.0
    container_name: lemp_mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-secret_root_pass_2026}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-lemp_database}
      - MYSQL_USER=${MYSQL_USER:-lemp_user}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-secret_user_pass_2026}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lemp-network

networks:
  lemp-network:
    driver: bridge

volumes:
  mysql_data:
    driver: local
